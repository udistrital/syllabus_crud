AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
    SAM Template for SYLLABUS lambda

Globals:
  Function:
    Timeout: 60

Parameters:
  CrudUsername:
    Description: Database User Username
    Type: String
    Default: ""
  CrudPass:
    Type: String
    Default: ""
  CrudHost:
    Type: String
    Default: ""
  CrudPort:
    Type: String
    Default: ""
  CrudDB:
    Type: String
    Default: ""
  Timezone:
    Type: String
    Default: "America/Bogota"

Resources:
  CrudSyllabusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/crud_syllabus/
      Handler: app.lambda_handler
      Runtime: python3.11
      VpcConfig:
        SecurityGroupIds:
          - sg-0ebc920d35b5e46a3
        SubnetIds:
          - subnet-2771567f
          - subnet-43b19769
      Environment:
        Variables:
          SYLLABUS_CRUD_HOST: !Ref CrudHost
          SYLLABUS_CRUD_PORT: !Ref CrudPort
          SYLLABUS_CRUD_USERNAME: !Ref CrudUsername
          SYLLABUS_CRUD_PASS: !Ref CrudPass
          SYLLABUS_CRUD_DB: !Ref CrudDB
          TIMEZONE: !Ref Timezone
      Events:
        CreateSyllabus:
          Type: Api
          Properties:
            Path: /syllabus
            Method: post

        GetSyllabus:
          Type: Api
          Properties:
            Path: /syllabus/{id}
            Method: get

        GetAllSyllabus:
          Type: Api
          Properties:
            Path: /syllabus
            Method: get

        PutSyllabus:
          Type: Api
          Properties:
            Path: /syllabus/{id}
            Method: put

        PutSyllabusEstado:
          Type: Api
          Properties:
            Path: /syllabus/{id}/estado
            Method: put

        PutSyllabusPublicar:
          Type: Api
          Properties:
            Path: /syllabus/{id}/publicar
            Method: put

        DeleteSyllabus:
          Type: Api
          Properties:
            Path: /syllabus/{id}
            Method: delete

  PostSyllabusGofpdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/gofpdf_syllabus/
      Handler: gofpdf_syllabus
      MemorySize: 160
      Runtime: go1.x
      Architectures:
        - x86_64
      Events:
        GetSyllabusGofPdf:
          Type: Api
          Properties:
            Path: /v2/syllabus/template
            Method: post

  WeasyPrintLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: syllabus-weasyprint-libs
      Description: Pango, cairo, gdk-pixbuf, fontconfig y fuentes para WeasyPrint (AL2023, x86_64)
      ContentUri: layers/weasyprint-al2023/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - x86_64
      LicenseInfo: Apache-2.0

  PostSyllabusHtml2PdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/html_2_pdf/
      Handler: app.lambda_handler
      Runtime: python3.12
      MemorySize: 1024
      Architectures:
        - x86_64
      Layers:
        - !Ref WeasyPrintLayer
      Environment:
        Variables:
          LD_LIBRARY_PATH: /opt/lib
          FONTCONFIG_PATH: /opt/fonts
          GDK_PIXBUF_MODULE_FILE: /opt/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
      Events:
        PostSyllabusHtml2Pdf:
          Type: Api
          Properties:
            Path: /v3/syllabus/template
            Method: post

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
